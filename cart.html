<body>
    <header class="header ">

    </header>

        <div class="cart__list">
            <!-- <div class="item">
                <img class="item__img" src="src/images/apple.jpg">
                <p class="item__name"> Название: <span class="text-bold" id="name">Яблоко</span></p>
                <p class="item__type">Сорт: <span class="text-bold" id="type">Криппс Пинк</span></p>
                <p class="item__price">Цена: <span class="text-bold" id="price">15</span></p>
                <p class="item__quantity">Кол-во: <span class="text-bold" id="quantity">3</span></p>
            </div>-->
        </div>
        <p class="cart__quantity">Количество товара: <span class="text-bold" id="total">0</span></p>

        <button class="cart__button" id="clearCart">Очистить корзину</button>
    </div>

    <template id="itemCart">
        <div class="item">
            <img class="item__image" src="">
            <p class="item__name"> Название: <span class="text-bold" id="name"></span></p>
            <p class="item__type">Сорт: <span class="text-bold" id="type"></span></p>
            <p class="item__price">Цена: <span class="text-bold" id="price"></span></p>
            <p class="item__quantity">Кол-во: <span class="text-bold" id="quantity"></span></p>
        </div>
    </template>
    <script src="cart.js" type="module"></script>
